name: Dependency updates

env:
  GIT_AUTHOR_EMAIL: shark@shark5060.net
  GIT_AUTHOR_NAME: Sayori
  GIT_COMMITTER_EMAIL: shark@shark5060.net
  GIT_COMMITTER_NAME: Sayori

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@sayori rebase'))
    runs-on: light-node26
    timeout-minutes: 20
    defaults:
      run:
        shell: sh

    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SAYORI_TOKEN }}

      - name: Enable pnpm
        run: npm install -g pnpm@12.6.0

      - name: Open or rebase dependency pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.SAYORI_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            node scripts/dependency-update.mjs --rebase
          else
            node scripts/dependency-update.mjs
          fi
