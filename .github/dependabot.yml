version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'daily'
      time: '00:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: 'scope'
    cooldown:
      default-days: 1
    # Actions runtime is Node 24; keep @types/node on that major.
    ignore:
      - dependency-name: '@types/node'
        versions:
          - '>=25.0.0'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '00:00'
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    # Floating @vN tags already track minor/patch; cooldown + full semver PRs
    # can "downgrade" relative to the retargeted major tag.
    cooldown:
      default-days: 1
      exclude:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
    groups:
      github-actions:
        patterns:
          - '*'
